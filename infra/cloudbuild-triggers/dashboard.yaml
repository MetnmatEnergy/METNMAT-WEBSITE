  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - package.json
  - turbo.json
  - Dockerfile.dashboard
  - cloudbuild.dashboard.deploy.yaml
name: rmgpgab-metnmat-dashboard-asia-south1-MetnmatEnergy-METNMAT-obs
