# Static, NON-secret environment for metnmat-cms.service.
NODE_ENV=production
PORT=3200
NODE_OPTIONS=--max-old-space-size=1536
NEXT_TELEMETRY_DISABLED=1
STORAGE_PROVIDER=s3
S3_BUCKET=metnmat-media-prod
# The CMS authenticates to S3 with its own IAM user's keys (in the secret), never
# the instance role; nftables already drops IMDS for app users (over a thousand
# blocked probes since boot came from this SDK's credential chain). Telling the
# SDK up front skips the probe and its timeout.
AWS_EC2_METADATA_DISABLED=true
S3_REGION=ap-south-1
CMS_URL=https://admin.metnmat.com
WEBSITE_URL=https://www.metnmat.com
TRUSTED_PROXY_IPS=127.0.0.1
# The chatbot's database name for the post-write resync; NEVER the CMS db.
CHATBOT_DB_NAME=metnmat
