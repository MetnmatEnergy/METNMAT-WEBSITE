# Static, NON-secret environment for metnmat-cms.service.
NODE_ENV=production
PORT=3200
NODE_OPTIONS=--max-old-space-size=1536
NEXT_TELEMETRY_DISABLED=1
STORAGE_PROVIDER=s3
S3_BUCKET=metnmat-media-prod
S3_REGION=ap-south-1
CMS_URL=https://admin.metnmat.com
WEBSITE_URL=https://www.metnmat.com
TRUSTED_PROXY_IPS=127.0.0.1
# The chatbot's database name for the post-write resync; NEVER the CMS db.
CHATBOT_DB_NAME=metnmat
