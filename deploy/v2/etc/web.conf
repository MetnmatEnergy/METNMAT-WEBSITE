# Static, NON-secret environment for metnmat-web.service. Checked in; merged by
# metnmat-fetch-secrets with metnmat/web/env (secret wins on a clash).
# NEXT_PUBLIC_* are inlined at BUILD time by the workflow and are not needed here.
NODE_ENV=production
PORT=3100
HOSTNAME=127.0.0.1
NODE_OPTIONS=--max-old-space-size=768
NEXT_TELEMETRY_DISABLED=1
TRUSTED_PROXY_IPS=127.0.0.1
