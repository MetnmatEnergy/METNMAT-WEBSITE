# Static, NON-secret environment for metnmat-web.service. Checked in; merged by
# metnmat-fetch-secrets with metnmat/web/env (secret wins on a clash).
# NEXT_PUBLIC_* are inlined at BUILD time by the workflow and are not needed here.
NODE_ENV=production
PORT=3100
HOSTNAME=127.0.0.1
NODE_OPTIONS=--max-old-space-size=768
NEXT_TELEMETRY_DISABLED=1
TRUSTED_PROXY_IPS=127.0.0.1
# Form alerts to the Metnmat Research WhatsApp group go through the Command
# Center on this same host (backend/lib/group-alert.ts). Inert until
# WEBSITE_ALERT_API_KEY is in metnmat/web/env with the value in metnmat/cc/env.
COMMAND_CENTER_URL=http://127.0.0.1:3000
