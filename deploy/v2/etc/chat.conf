# Static, NON-secret environment for metnmat-chat.service (metnmat_customer_agent, Bun).
NODE_ENV=production
PORT=3002
# Loopback only: Caddy is the only client. Without this the Bun server listened
# on every interface and was reachable from any other host in the VPC.
BIND_HOST=127.0.0.1
PUBLIC_URL=https://chat.metnmat.com
ALLOWED_ORIGINS=https://www.metnmat.com,https://metnmat.com
WIDGET_FRAME_ANCESTORS=https://www.metnmat.com https://metnmat.com
