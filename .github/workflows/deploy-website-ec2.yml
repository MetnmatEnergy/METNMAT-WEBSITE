name: Deploy website to EC2

# Builds the public website on a GitHub runner and releases it to the shared
# EC2 instance via S3 + SSM. This replaces the ECS/Fargate pipeline, which
# targeted infrastructure that has since been deleted.
#
# The shape, and why:
#
#   runner: install -> test -> build -> package -> upload to private S3
#   EC2:    SSM pulls the artifact, unpacks beside the live release, swaps a
#           symlink, reloads ONE pm2 process, health-checks, rolls back on fail
#
# The production server never compiles anything. `next build` peaks well above
# a gigabyte, and this box has ~650 MB free (measured 2026-08-12) while also
# serving the internal command-center dashboard. Building here would evict that
# app from memory.
#
# Nothing in this workflow can restart the dashboard: it names a single pm2
# process and writes only under /home/ec2-user/web.
#
# INERT UNTIL CONFIGURED. Without the AWS settings below every job exits with a
# notice instead of a failure, so this can merge while AWS is still being set
# up without turning the repo red.
#
#   secret  AWS_DEPLOY_ROLE_ARN   role assumed via OIDC (preferred)
#   var     EC2_INSTANCE_ID       i-0123456789abcdef0
#   var     ARTIFACT_BUCKET       private bucket for build artifacts

on:
  push:
    branches: [main]
    # Path filters are the point. The GCP triggers have none, so a docs-only
    # commit currently rebuilds and redeploys both applications.
    paths:
      - "apps/website/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "deploy/**"
      - ".github/workflows/deploy-website-ec2.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (blank = current HEAD). Use to roll forward/back."
        required: false
        type: string

concurrency:
  # Two deploys racing to move the same symlink is how you end up serving a
  # half-swapped release. Queue them; never cancel one mid-swap.
  group: deploy-website-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ARTIFACT_PREFIX: website
  # Repository variables win when set. These fallbacks exist because the
  # variables read as empty on the first attempt — GitHub keeps ENVIRONMENT
  # variables separate from REPOSITORY variables, and `vars.*` only resolves the
  # former when a job declares `environment:`. Both values are non-sensitive
  # infrastructure identifiers; the credentials stay in Settings -> Secrets.
  #
  # Held back until pre-flight was green, deliberately: this workflow triggers
  # on push, so adding them earlier would have made the first production deploy
  # a side effect of an unrelated commit.
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-0b7f49ca3e9852d4b' }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET || 'metnmat-deploy-artifacts-976134557584' }}
  APP_NAME: metnmat-website
  APP_ROOT: /home/ec2-user/web
  APP_PORT: "3100"
  # Baked into the client bundle at BUILD time — NEXT_PUBLIC_* cannot be
  # supplied at runtime, so these cannot live in Secrets Manager with the
  # others. All are public hostnames, so none changes at DNS cutover.
  CMS_URL: https://admin.metnmat.com
  # Load-bearing, not cosmetic. middleware.ts derives the canonical host from
  # NEXT_PUBLIC_SITE_URL and, when it is unset, canonicalHost() returns null and
  # the apex→www 308 is skipped ENTIRELY. That split is what previously produced
  # host-only auth cookies: sessions did not survive a tab close and Google
  # sign-in failed, because the OAuth state cookie landed on the apex while
  # redirect_uri pointed at www. Verified live after cutover — the apex answered
  # 200 instead of redirecting, because this was missing from the build.
  SITE_URL: https://www.metnmat.com
  # Two components reference the chatbot. Left pointing at the existing service;
  # it has not migrated and lives in a separate repository.
  CHATBOT_URL: https://chat.metnmat.com

permissions:
  contents: read
  id-token: write # OIDC; without this the role assumption fails

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      auth: ${{ steps.guard.outputs.auth }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check AWS is configured
        id: guard
        run: |
          # Two auth paths. OIDC is preferred and wins when both exist: it issues
          # short-lived credentials with nothing durable to leak. Access keys are
          # the bootstrap fallback so deploys can run before the OIDC role
          # exists — enter them in Settings → Secrets, never in a file or a chat.
          auth=""
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            auth="oidc"
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            auth="keys"
          fi

          if [ -n "$auth" ] && [ -n "${{ env.EC2_INSTANCE_ID }}" ] && [ -n "${{ env.ARTIFACT_BUCKET }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "auth=$auth" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploying with $auth credentials."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not configured — need EC2_INSTANCE_ID + ARTIFACT_BUCKET (vars) and either AWS_DEPLOY_ROLE_ARN or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (secrets). Skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Resolve deploy SHA
        id: resolve
        if: steps.guard.outputs.configured == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          version: 11.5.1

      # 22 for the BUILD; the instance runs 20. That split is forced, not chosen.
      #
      # Matching the runtime was tried first and cannot work: pnpm 11.5.1 — the
      # version this repo pins via packageManager — requires Node >=22.13 and
      # dies on 20 with `No such built-in module: node:sqlite`. The build tool
      # sets the floor here, not the application.
      #
      # What makes the split acceptable rather than merely unavoidable:
      #   - root engines declares ">=20", so the app supports the runtime it
      #     lands on
      #   - the website bundle has no native modules (sharp is dashboard-only),
      #     so there is no ABI compiled against the wrong major
      #   - GCP already builds AND runs this app on node:22, so 22 is the
      #     version it is actually exercised against
      #
      # It is still a split, and splits are where "works in CI" starts. The
      # clean fix is to move the instance to Node 22 so build and runtime match
      # — a change that touches the dashboard sharing this box, so it belongs to
      # whoever owns that, not to this workflow. Until then this is the only
      # combination that both builds and runs.
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.guard.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # Next's own cache, keyed on the lockfile + source. Repeat builds of an
      # unchanged tree drop from minutes to seconds.
      - name: Restore Next.js build cache
        if: steps.guard.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: apps/website/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/website/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The commit gate from CLAUDE.md, run before anything is published.
      - name: Typecheck
        if: steps.guard.outputs.configured == 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.guard.outputs.configured == 'true'
        run: pnpm lint

      - name: Test
        if: steps.guard.outputs.configured == 'true'
        run: pnpm test

      - name: Build
        if: steps.guard.outputs.configured == 'true'
        env:
          NEXT_OUTPUT: standalone
          NEXT_PUBLIC_CMS_URL: ${{ env.CMS_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_CHATBOT_URL: ${{ env.CHATBOT_URL }}
          NODE_ENV: production
        run: pnpm --filter website build

      # Next writes the standalone server, its static assets and public/ to
      # three different places. Assembling them here — rather than on the
      # server — means the artifact is the whole runnable app.
      - name: Assemble release
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          cd apps/website
          cp -r .next/standalone release
          mkdir -p release/apps/website/.next
          cp -r .next/static release/apps/website/.next/static
          [ -d public ] && cp -r public release/apps/website/public

          # Fail on the runner, not on the server. If the monorepo layout ever
          # changes, this is where it should break — with the tree in front of
          # you, before anything is published.
          if [ ! -f release/apps/website/server.js ]; then
            echo "::error::server.js not at the expected path. Standalone layout:"
            find release -maxdepth 3 -name server.js
            exit 1
          fi
          [ -f release/apps/website/.next/BUILD_ID ] || { echo "::error::BUILD_ID missing"; exit 1; }

          # Ship the runtime config INSIDE the artifact so it is versioned with
          # the code it runs. A config copied onto the box once drifts silently:
          # the repo says one thing, the server does another, and the difference
          # only shows up during an incident. release.sh installs these.
          mkdir -p release/_deploy
          cp ../../deploy/pm2/ecosystem.config.cjs release/_deploy/
          cp ../../deploy/bin/with-secrets.sh      release/_deploy/

          tar -czf web-build.tgz -C release .
          echo "artifact: $(du -h web-build.tgz | cut -f1)"

      - name: Assume AWS role (OIDC)
        if: steps.guard.outputs.configured == 'true' && steps.guard.outputs.auth == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-website-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Temporary by design: once AWS_DEPLOY_ROLE_ARN exists the step above wins
      # and this stops running, after which the access key should be deleted
      # from both GitHub and IAM.
      - name: Configure AWS credentials (bootstrap keys)
        if: steps.guard.outputs.configured == 'true' && steps.guard.outputs.auth == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact and release script
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          DEST="s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/${{ steps.resolve.outputs.sha }}"
          aws s3 cp apps/website/web-build.tgz "$DEST/web-build.tgz" --only-show-errors
          # Shipped with the artifact so the release logic is versioned with the
          # code it releases, instead of drifting on the server.
          aws s3 cp deploy/bin/release.sh "$DEST/release.sh" --only-show-errors
          echo "uploaded to $DEST"

  deploy:
    needs: build
    if: needs.build.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS role (OIDC)
        if: needs.build.outputs.auth == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (bootstrap keys)
        if: needs.build.outputs.auth == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM, not SSH. No inbound port is opened, no key is held in GitHub, and
      # every command is recorded in CloudTrail against the assumed role.
      - name: Release via SSM
        id: ssm
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          # HEALTH_TIMEOUT is raised to 180 below, matching the CMS. release.sh
          # defaults to 90 and that is not enough on this box: four applications
          # share it with roughly 400 MB of headroom, and a cold Next.js boot for
          # the larger of the two apps exceeds 90s. Deploy d4a6d1c failed on
          # exactly that - the check gave up while the app was still starting,
          # the rollback then timed out on its own check, and the run reported
          # "ROLLBACK DID NOT RESTORE SERVICE" for a site that was healthy.
          CMD=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy website $SHA" \
            --timeout-seconds 900 \
            --parameters commands="[
              \"set -euo pipefail\",
              \"export ARTIFACT_BUCKET='${{ env.ARTIFACT_BUCKET }}'\",
              \"export ARTIFACT_PREFIX='${{ env.ARTIFACT_PREFIX }}'\",
              \"export APP_NAME='${{ env.APP_NAME }}'\",
              \"export APP_ROOT='${{ env.APP_ROOT }}'\",
              \"export APP_PORT='${{ env.APP_PORT }}'\",
              \"export HEALTH_TIMEOUT='180'\",
              \"aws s3 cp s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/$SHA/release.sh /tmp/release.sh --only-show-errors\",
              \"chmod +x /tmp/release.sh\",
              \"sudo -E -u ec2-user bash /tmp/release.sh $SHA\"
            ]" \
            --query 'Command.CommandId' --output text)
          echo "command-id=$CMD" >> "$GITHUB_OUTPUT"
          echo "SSM command $CMD dispatched"

          # `wait command-executed` exits non-zero on failure, which is what we
          # want — but it swallows the output, so capture it either way.
          # Polled, not `aws ssm wait command-executed`. That waiter gives up
          # after ~100 seconds and then reports InProgress, which reads as a
          # failed deploy while the release is still running perfectly. The
          # website's artifact is small enough that it has never hit the limit;
          # the CMS deploy hit it on its first run. Fixing it here too rather
          # than waiting for a slow release to make this the same bug twice.
          set +e
          WAIT_RC=1
          for i in $(seq 1 90); do   # 90 x 10s = 15 minutes
            S="$(aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" --query 'Status' --output text 2>/dev/null || echo Pending)"
            case "$S" in
              Success)                    WAIT_RC=0; break ;;
              Failed|Cancelled|TimedOut)  WAIT_RC=1; break ;;
            esac
            sleep 10
          done
          set -e

          echo "--- release output ---"
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text || true
          echo "--- stderr ---"
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' --output text || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query 'Status' --output text)
          echo "status: $STATUS"
          if [ "$STATUS" != "Success" ] || [ $WAIT_RC -ne 0 ]; then
            echo "::error::Release failed ($STATUS). The script rolls back automatically; check the output above to confirm it did."
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          {
            echo "### Website deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Instance | \`${{ env.EC2_INSTANCE_ID }}\` |"
            echo "| Process | \`${{ env.APP_NAME }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "Roll back by re-running this workflow with an earlier SHA, or on the box:"
            echo '```bash'
            echo "ln -sfn \$(readlink -f ${{ env.APP_ROOT }}/previous) ${{ env.APP_ROOT }}/current.tmp"
            echo "mv -Tf ${{ env.APP_ROOT }}/current.tmp ${{ env.APP_ROOT }}/current"
            echo "pm2 reload ${{ env.APP_NAME }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
