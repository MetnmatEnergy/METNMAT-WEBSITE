name: Deploy to AWS

# Builds and deploys the website and dashboard to ECS Fargate in ap-south-1.
#
# THIS RUNS ALONGSIDE THE EXISTING GCP PIPELINE. It does not touch Cloud Build,
# Cloud Run, or ci.yml. Both clouds stay independently deployable, which is what
# makes the migration reversible.
#
# It is INERT until you set the AWS_DEPLOY_ROLE_ARN repository secret. Without
# it, every job short-circuits with a notice instead of failing — so this can be
# merged today, while AWS is still being stood up, without turning the repo red.
#
# The chatbot is NOT here: it deploys from a separate repository.

on:
  push:
    branches: [main]
    # Path filters are the point. The GCP triggers have none, so a documentation
    # commit currently rebuilds and redeploys BOTH applications — measured at 8
    # of the last 20 commits. Do not repeat that here.
    paths:
      - "apps/website/**"
      - "apps/dashboard/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - "Dockerfile.website"
      - "Dockerfile.dashboard"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to deploy"
        required: true
        default: both
        type: choice
        options: [both, website, dashboard]

concurrency:
  # Never let two deploys of the same branch race. This is the failure mode that
  # currently exists on GCP, where two triggers deploy different images to the
  # same service and whichever finishes last wins.
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: metnmat-cluster

permissions:
  contents: read
  id-token: write # required for OIDC; without it the role assumption fails

jobs:
  # ── Decide what to build ───────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.decide.outputs.website }}
      dashboard: ${{ steps.decide.outputs.dashboard }}
      configured: ${{ steps.guard.outputs.configured }}
      auth: ${{ steps.guard.outputs.auth }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the parent commit to diff against

      # Accepts EITHER auth method, so deploys are not blocked waiting for the
      # OIDC role to exist. OIDC is preferred and wins when both are present;
      # the bootstrap access keys are the fallback that lets images ship the
      # moment ECR exists, without a second round-trip to set another secret.
      - name: Check AWS is configured
        id: guard
        run: |
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "auth=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::Using OIDC role (no long-lived key)."
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "auth=keys" >> "$GITHUB_OUTPUT"
            echo "::warning::Using bootstrap access keys. Set AWS_DEPLOY_ROLE_ARN to switch to short-lived OIDC credentials and then delete the key."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No AWS credentials — skipping deploy."
          fi

      - name: Decide which services changed
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.service }}" in
              both)      w=true;  d=true  ;;
              website)   w=true;  d=false ;;
              dashboard) w=false; d=true  ;;
            esac
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
                      || git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'

            # Shared inputs rebuild BOTH. These are exactly the paths each
            # Dockerfile COPYs, so anything here can change either image.
            # Note apps/*/package.json appears in the other app's build too:
            # pnpm needs the whole workspace manifest set to resolve, and
            # omitting it fails silently against a stale dependency graph.
            if echo "$changed" | grep -qE '^(packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|\.github/workflows/deploy-aws\.yml)'; then
              w=true; d=true
            else
              w=false; d=false
              echo "$changed" | grep -qE '^(apps/website/|Dockerfile\.website)'     && w=true || true
              echo "$changed" | grep -qE '^(apps/dashboard/|Dockerfile\.dashboard)' && d=true || true
            fi
          fi
          echo "website=$w"   >> "$GITHUB_OUTPUT"
          echo "dashboard=$d" >> "$GITHUB_OUTPUT"
          echo "→ website=$w dashboard=$d"

  # ── Build, push, deploy ────────────────────────────────────────────────────
  deploy:
    needs: plan
    if: needs.plan.outputs.configured == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One service failing must not abandon a healthy deploy of the other.
      fail-fast: false
      matrix:
        include:
          - service: website
            dockerfile: Dockerfile.website
            build: ${{ needs.plan.outputs.website }}
          - service: dashboard
            dockerfile: Dockerfile.dashboard
            build: ${{ needs.plan.outputs.dashboard }}

    steps:
      - name: Skip unchanged service
        if: matrix.build != 'true'
        run: echo "::notice::${{ matrix.service }} unchanged — nothing to build."

      - uses: actions/checkout@v4
        if: matrix.build == 'true'

      # OIDC: GitHub mints a short-lived token and exchanges it for temporary
      # AWS credentials. No access key is stored in this repository, so there is
      # nothing to leak or rotate. The trust policy pins both the repo AND the
      # branch — see infra/aws/iam.tf.
      # Two mutually-exclusive credential paths. They MUST be separate steps:
      # configure-aws-credentials fails outright if role-to-assume is passed as
      # an empty string, so a single step guarded only by `configured` would
      # break the access-key path at the exact moment it is needed.
      - name: Assume AWS role via OIDC
        if: matrix.build == 'true' && needs.plan.outputs.auth == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      # Bootstrap fallback so images can ship before the OIDC role exists.
      # Temporary by design: once AWS_DEPLOY_ROLE_ARN is set, the step above
      # wins and this one stops running, after which the access key can be
      # deleted from both GitHub and IAM.
      - name: Configure AWS credentials (bootstrap keys)
        if: matrix.build == 'true' && needs.plan.outputs.auth == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: matrix.build == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: matrix.build == 'true'

      # Layer caching via the GitHub Actions cache. The GCP builds have NO cache
      # at all — one trigger even forces --no-cache — so every build there
      # reinstalls dependencies from scratch. This reuses the dependency layer
      # whenever the lockfile is unchanged.
      - name: Build and push
        if: matrix.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Immutable, content-addressed. ECR is configured IMMUTABLE, so a
          # rebuild of the same SHA is rejected rather than silently replacing
          # the image — which is what makes rollback meaningful.
          tags: ${{ steps.ecr.outputs.registry }}/metnmat/${{ matrix.service }}:${{ github.sha }}
          # NEXT_PUBLIC_* are INLINED INTO THE CLIENT BUNDLE at build time, not
          # read at runtime — so they cannot be supplied by ECS environment
          # variables the way every other setting is. Omitting them does not
          # fail the build: next.config.mjs falls back to http://localhost:3001,
          # and the deploy "succeeds" while shipping a site whose browser code
          # calls a CMS on the visitor's own machine. The GCP pipeline passes
          # these via --build-arg (cloudbuild.website.deploy.yaml); this one had
          # not been given them.
          #
          # Harmless for the dashboard, whose Dockerfile declares no such ARGs —
          # Docker ignores build args a Dockerfile does not consume.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.metnmat.com
            NEXT_PUBLIC_CMS_URL=https://admin.metnmat.com
            NEXT_PUBLIC_CHATBOT_URL=https://chat.metnmat.com
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: false

      # Read the CURRENT task definition and swap only the image. Rendering it
      # from scratch here would silently drop env vars and secrets that
      # Terraform owns.
      - name: Render task definition
        if: matrix.build == 'true'
        id: taskdef
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "metnmat-${{ matrix.service }}" \
            --query 'taskDefinition' --output json > current.json
          # Strip the read-only fields AWS rejects on re-registration.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)' current.json > taskdef.json
          echo "path=taskdef.json" >> "$GITHUB_OUTPUT"

      - name: Update image in task definition
        if: matrix.build == 'true'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.taskdef.outputs.path }}
          container-name: ${{ matrix.service }}
          image: ${{ steps.ecr.outputs.registry }}/metnmat/${{ matrix.service }}:${{ github.sha }}

      # wait-for-service-stability is what turns a bad image into a failed
      # deploy rather than a broken site: ECS rolls back via the deployment
      # circuit breaker, and this step fails so the run goes red.
      - name: Deploy to ECS
        if: matrix.build == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: metnmat-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Summary
        if: matrix.build == 'true'
        run: |
          {
            echo "### ${{ matrix.service }} deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image tag | \`${{ github.sha }}\` |"
            echo "| Cluster | \`${{ env.ECS_CLUSTER }}\` |"
            echo "| Region | \`${{ env.AWS_REGION }}\` |"
            echo ""
            echo "Roll back by re-running a previous successful run, or:"
            echo '```'
            echo "aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} \\"
            echo "  --service metnmat-${{ matrix.service }} \\"
            echo "  --task-definition metnmat-${{ matrix.service }}:<PREVIOUS_REVISION> \\"
            echo "  --region ${{ env.AWS_REGION }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
